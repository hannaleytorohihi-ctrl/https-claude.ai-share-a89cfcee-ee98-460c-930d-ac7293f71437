<style>
:root{color-scheme:dark;--ink:#050505;--paper:#F5F5F5;--mute:#B8B8B8;--gold:#C9A45C;--gold2:#E3C77A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--ink);color:var(--paper);font:400 17px/1.55 'Hanken Grotesk','Helvetica Neue',Arial,sans-serif}
main{width:100%;max-width:520px;text-align:center}
p.k{margin:0 0 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{margin:0 0 14px;font:600 clamp(32px,8vw,48px)/1.08 'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;letter-spacing:-.02em}
p.t{margin:0 0 32px;color:var(--mute)}
a.b{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:600;text-decoration:none}
a.b:hover{background:var(--gold2)}
a.b:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="k">Erreur 404</p>
<h1>Cette page n’existe pas.</h1>
<p class="t">Le lien est peut-être ancien, ou l’adresse mal écrite. Le site, lui, est toujours là.</p>
<a class="b" id="home" href="/">Revenir à l’accueil</a>
</main>
<script>
/* Chemin de l'accueil. Site de projet GitHub Pages (utilisateur.github.io/nom-du-depot/) : on déduit le dossier du depot.
   Si ton dépôt s'appelle « utilisateur.github.io », ou si tu utilises un domaine perso, remplace par : var BASE='/'; */
var BASE='';
(function(){
  var p=location.pathname.split('/').filter(Boolean);
  var b=BASE||((/\.github\.io$/.test(location.hostname)&&p.length)?'/'+p[0]+'/':'/');
  document.getElementById('home').setAttribute('href',b);
})();
</script>
</body>
</html>
